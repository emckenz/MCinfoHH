name: APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/**
    paths-ignore:
      - apk/**

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compiler l’APK Fold
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paquets SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              ANDROID_HOME="$ANDROID_SDK_ROOT"
            elif [ -d /usr/local/lib/android/sdk ]; then
              ANDROID_HOME=/usr/local/lib/android/sdk
            else
              ANDROID_HOME="$HOME/android-sdk"
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              curl -fsSL -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
              unzip -q /tmp/commandlinetools.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            fi
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          toolbin=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            toolbin="$ANDROID_HOME/cmdline-tools/latest/bin"
          else
            found="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
            if [ -n "$found" ]; then
              toolbin="$(dirname "$found")"
            fi
          fi
          if [ -z "$toolbin" ]; then
            echo "sdkmanager introuvable sous $ANDROID_HOME" >&2
            ls -la "$ANDROID_HOME" >&2 || true
            exit 1
          fi
          echo "$toolbin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$toolbin:$PATH"
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Dépendances
        run: npm ci
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Projet Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Signature de débogage stable
        env:
          KEYSTORE_BASE64: ${{ secrets.MAISON_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "Pas de secret MAISON_KEYSTORE_BASE64 : Gradle créera une signature de débogage propre à ce run. Une mise à jour exigera de désinstaller l’application."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "Signature de débogage reprise depuis le secret."

      - name: Compilation
        working-directory: android
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          else
            printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> gradle.properties
          fi
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/maison-fold-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/maison-fold-debug.apk"

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: maison-fold-debug
          path: maison-fold-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Déposer l’APK dans le dépôt
        run: |
          set -euo pipefail
          mkdir -p apk
          cp "$GITHUB_WORKSPACE/maison-fold-debug.apk" apk/maison-fold-debug.apk
          sha256sum apk/maison-fold-debug.apk | tee apk/maison-fold-debug.sha256
          bytes=$(wc -c < apk/maison-fold-debug.apk)
          echo "Taille : ${bytes} octets"
          if [ "$bytes" -ge 100000000 ]; then
            echo "GitHub refuse les fichiers d’au moins 100 Mo (${bytes} octets)." >&2
            exit 1
          fi
          git add -- apk/maison-fold-debug.apk apk/maison-fold-debug.sha256
          if git diff --cached --quiet; then
            echo "L’APK déjà dans le dépôt est identique."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publie l’APK Fold [skip ci]"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
